[pytest]
# O cache do pytest vai para um caminho gravavel fora de /app.
#
# Na imagem de producao o processo roda como `appuser` (uid 10001) e /app
# pertence ao root, entao o cache padrao (`/app/.pytest_cache`) falha com
# Permission denied. A alternativa seria dar chown de /app para o appuser, mas
# isso deixaria o proprio codigo gravavel pelo usuario de runtime — um
# processo comprometido poderia se reescrever. Melhor mover o cache.
cache_dir = /tmp/pytest_cache
