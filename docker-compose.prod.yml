# Compose de PRODUCAO. O de desenvolvimento (`docker-compose.yml`) continua
# valendo e nao e sobrescrito por este — os dois convivem no repo.
#
# Diferencas deliberadas em relacao ao de dev:
#   - imagem construida com Dockerfile.prod (multi-stage, non-root)
#   - nenhum bind mount de codigo: o que roda e o que foi assado na imagem
#   - postgres e redis SEM `ports:` — alcancaveis so pela rede interna
#   - backend publicado apenas em 127.0.0.1, para o Nginx do host fazer proxy
#   - sem pgadmin e sem frontend
#
# CUIDADO com o nome do projeto. O Compose deriva o nome do diretorio, que e o
# MESMO para este arquivo e para o de dev. Rodar sem `-p` na maquina de
# desenvolvimento faz o Compose convergir o projeto de dev para esta
# definicao: derruba pgadmin e frontend e recria backend/worker/beat com a
# imagem de producao. Sempre isole com `-p`:
#
#   docker compose -p publicaradmlb-prod -f docker-compose.prod.yml up -d --build
#
# Na VPS isso e inofensivo (nao ha stack de dev la), mas o habito evita o
# acidente aqui.
#
# Subir:
#   docker compose -f docker-compose.prod.yml up -d --build
# Migrations (passo manual e deliberado, nunca automatico no boot):
#   docker compose -f docker-compose.prod.yml run --rm backend alembic upgrade head
# Diagnostico pos-deploy:
#   docker compose -f docker-compose.prod.yml exec backend pytest -q

services:

  # ── Banco de dados ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    # Sem `ports:` de proposito. O `ufw` NAO filtra portas publicadas via
    # Docker: publicar 5432 aqui exporia o banco na internet mesmo com o
    # firewall fechado. Os outros servicos alcancam pelo DNS interno do
    # compose (`postgres:5432`).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache e fila ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data_prod:/data
    # Sem `ports:` — mesma razao do postgres.
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Backend ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Publicado SO no loopback: quem fala com esta porta e o Nginx do host,
    # via proxy reverso. `"8010:8000"` (sem o 127.0.0.1) abriria em todas as
    # interfaces e furaria o ufw, porque o Docker escreve as proprias regras
    # de NAT antes das do firewall.
    # 8010 evita as portas ja documentadas deste projeto: 8001 (backend dev),
    # 5433, 6379, 3000, 5050.
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Trava explicita: `Settings.environment` tem default "development", e
      # `main.py` so desliga o /docs quando o valor NAO e "development".
      # Setar aqui garante o Swagger fechado mesmo que o .env de producao
      # esqueca a variavel — nao dependemos de alguem lembrar.
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Sem `ports:` — worker nao atende ninguem de fora, so consome fila.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4 -Q default,images,ai,publish

  # ── Celery Beat (agendador) ──────────────────────────────
  # ATENCAO: `celery_app.py` nao define `beat_schedule` nenhum hoje — nao ha
  # tarefa periodica no sistema. Este servico sobe um agendador vazio. Esta
  # aqui para o dia em que existir tarefa agendada; se a VPS estiver apertada
  # de memoria, e o primeiro candidato a ficar de fora sem perda funcional.
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    # Sem `ports:`.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      # O schedule sobrevive a recriacao do container. Rodando non-root, o
      # caminho precisa pertencer ao appuser — /app e do root na imagem.
      - celerybeat_data_prod:/home/appuser/celerybeat
    command: celery -A app.workers.celery_app beat --loglevel=info --schedule=/home/appuser/celerybeat/celerybeat-schedule

volumes:
  postgres_data_prod:
  redis_data_prod:
  celerybeat_data_prod:
